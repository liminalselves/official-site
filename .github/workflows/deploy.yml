name: Deploy to deploy branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test service
        run: npm test

      - name: Build both sites
        run: npm run build

      - name: Deploy to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先把产物移出工作区：目标分支跟踪过同名旧文件时，
          # checkout 会用旧跟踪文件静默覆盖未跟踪的新文件，随后被 git rm 删掉
          # deploy-server：整套服务（server/ + 两站页面），服务器 git pull 后重启服务即可
          mkdir -p /tmp/service
          cp -r server /tmp/service/server
          rm -rf /tmp/service/server/test
          cp -r dist /tmp/service/dist
          mv dist-aliyapet /tmp/service/dist-aliyapet
          # deploy：主站纯静态页面，供尚未切换到服务的旧部署使用，切换完成后删除这一段
          mv dist /tmp/dist

          publish() {
            branch=$1 src=$2
            # 基于远程分支最新历史追加提交，保证服务器 git pull 可快进更新
            git fetch origin "$branch:$branch" 2>/dev/null || true
            if git show-ref --verify --quiet "refs/heads/$branch"; then
              git checkout "$branch"
            else
              git checkout --orphan "$branch"
            fi
            git rm -rf . --quiet 2>/dev/null || true
            # 发布分支只收产物，.gitignore 本身也要带上（不随构建输出走）
            printf '%s\n%s\n' node_modules .astro > .gitignore
            cp -r "$src/." .
            git add -A
            # 无内容变化时跳过提交
            git diff --cached --quiet || git commit -m "deploy: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push origin "$branch"
          }
          publish deploy-server /tmp/service
          publish deploy /tmp/dist
