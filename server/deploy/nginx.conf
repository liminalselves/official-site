# Nginx only terminates HTTPS and forwards everything to the Node service; pages, APIs and
# downloads all come from it. Copy one server block per domain and change server_name and the
# certificate paths; the service picks the site from the Host header.

server {
    listen 443 ssl;
    server_name www.liminalselves.top;
    ssl_certificate     /ssl/www.pem;
    ssl_certificate_key /ssl/www.key;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name aliyapet.liminalselves.top;
    ssl_certificate     /ssl/aliyapet.pem;
    ssl_certificate_key /ssl/aliyapet.key;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Stream large downloads straight through instead of buffering them to disk.
        proxy_buffering off;
    }
}

# The bare domain redirects to www so search engines index one copy.
server {
    listen 443 ssl;
    server_name liminalselves.top;
    ssl_certificate     /ssl/www.pem;
    ssl_certificate_key /ssl/www.key;
    return 301 https://www.liminalselves.top$request_uri;
}
