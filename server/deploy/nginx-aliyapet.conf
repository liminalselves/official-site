# Aliya Pet download site + release service. Add more mirror domains to server_name as needed;
# every link the service returns follows the requesting host.
server {
    listen 443 ssl http2;
    server_name aliyapet.liminalselves.top;
    # ssl_certificate / ssl_certificate_key ...

    root /opt/aliyapet/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # Live2D 网页嵌入：模型、贴图、台词文件名不带哈希，更新后要能立即生效。
    location /pet/ {
        add_header Cache-Control "no-cache";
        location ~* ^/pet/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    location ~* \.(?:css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /download/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mirrored installers are written by the service and served directly by Nginx.
    location /files/ {
        alias /var/lib/aliyapet/releases/;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
